<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi ni&ntilde;a bonita</title>
    <style>
        :root { --bg: #05070a; --yellow: #ffeb3b; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Arial', sans-serif; display: flex; align-items: center; justify-content: center; }
        
        #star-field { position: fixed; inset: 0; z-index: 1; background: radial-gradient(circle at center, #1a1c2c 0%, #05070a 100%); }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--d) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Estrellas Fugaces */
        .shooting-star { position: absolute; width: 2px; height: 2px; background: white; box-shadow: 0 0 10px white; animation: shoot 4s linear infinite; opacity: 0; z-index: 2; }
        @keyframes shoot { 0% { transform: translateX(0) translateY(0) scale(1); opacity: 1; } 100% { transform: translateX(-500px) translateY(500px) scale(0); opacity: 0; } }

        #welcome { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.8s; }
        .btn-inicio { padding: 15px 45px; font-size: 1.3rem; background: transparent; color: var(--yellow); border: 2px solid var(--yellow); border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px var(--yellow); font-weight: bold; }

        #content { position: relative; z-index: 10; display: none; flex-direction: column; align-items: center; text-align: center; height: 100vh; width: 100%; }
        h1 { color: var(--yellow); text-shadow: 0 0 15px var(--yellow); margin-top: 50px; font-size: 2.2rem; }
        
        .bouquet-container { position: absolute; bottom: -10px; width: 380px; height: 450px; display: flex; justify-content: center; animation: up 2s ease-out forwards; cursor: pointer; }
        @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .flower-group { transform-origin: center bottom; animation: sway 4s infinite ease-in-out alternate; }
        @keyframes sway { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }

        /* Animación de las flores al tocar */
        .pop-flower { position: absolute; font-size: 1.5rem; animation: popUp 1.5s ease-out forwards; opacity: 0; z-index: 15; pointer-events: none; }
        @keyframes popUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2) rotate(360deg); opacity: 0; }
        }

        #phrase-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.96); padding: 30px; border: 2px solid var(--yellow); border-radius: 20px; z-index: 200; color: white; width: 85%; text-align: center; }
        .close-btn { margin-top: 20px; padding: 12px 30px; background: var(--yellow); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="star-field"></div>

    <div id="welcome">
        <h2 style="color:white; margin-bottom:30px;">TENGO ALGO PARA TI...</h2>
        <button class="btn-inicio" onclick="start()">PRESIONA AQU&Iacute;</button>
    </div>

    <div id="content">
        <h1>Feliz D&iacute;a de las<br>Flores Amarillas</h1>
        <div id="bouquet" class="bouquet-container" onclick="handleBouquetClick(event)">
            <svg viewBox="0 0 200 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff59d" />
                        <stop offset="50%" style="stop-color:#ffeb3b" />
                        <stop offset="100%" style="stop-color:#fbc02d" />
                    </linearGradient>
                </defs>

                <g fill="#1b5e20">
                    <path d="M0 240 Q100 215 200 240 L200 250 L0 250 Z" />
                    <circle cx="100" cy="238" r="12" />
                </g>

                <g stroke="#2e7d32" stroke-width="3.5" fill="none" stroke-linecap="round">
                    <path d="M100 240 Q100 180 70 100" />
                    <path d="M100 240 Q100 180 130 100" />
                    <path d="M100 240 L100 80" />
                    <path d="M100 240 Q100 190 45 145" />
                    <path d="M100 240 Q100 190 155 145" />
                </g>

                <g class="flower-group">
                    <g transform="translate(100, 80)">
                        <ellipse cx="0" cy="0" rx="15" ry="25" fill="url(#tGrad)" />
                        <ellipse cx="-8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(-20)" opacity="0.9"/>
                        <ellipse cx="8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(20)" opacity="0.9"/>
                        <circle cx="0" cy="5" r="6" fill="#f9a825" />
                    </g>
                    <g transform="translate(70, 105)">
                        <ellipse cx="0" cy="0" rx="15" ry="25" fill="url(#tGrad)" />
                        <ellipse cx="-8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(-20)" opacity="0.9"/>
                        <ellipse cx="8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(20)" opacity="0.9"/>
                        <circle cx="0" cy="5" r="6" fill="#f9a825" />
                    </g>
                    <g transform="translate(130, 105)">
                        <ellipse cx="0" cy="0" rx="15" ry="25" fill="url(#tGrad)" />
                        <ellipse cx="-8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(-20)" opacity="0.9"/>
                        <ellipse cx="8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(20)" opacity="0.9"/>
                        <circle cx="0" cy="5" r="6" fill="#f9a825" />
                    </g>
                    <g transform="translate(45, 145)">
                        <ellipse cx="0" cy="0" rx="15" ry="25" fill="url(#tGrad)" />
                        <ellipse cx="-8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(-20)" opacity="0.9"/>
                        <ellipse cx="8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(20)" opacity="0.9"/>
                        <circle cx="0" cy="5" r="6" fill="#f9a825" />
                    </g>
                    <g transform="translate(155, 145)">
                        <ellipse cx="0" cy="0" rx="15" ry="25" fill="url(#tGrad)" />
                        <ellipse cx="-8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(-20)" opacity="0.9"/>
                        <ellipse cx="8" cy="2" rx="13" ry="23" fill="url(#tGrad)" transform="rotate(20)" opacity="0.9"/>
                        <circle cx="0" cy="5" r="6" fill="#f9a825" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <div id="phrase-modal">
        <p id="msg-text" style="font-size: 1.5rem; line-height: 1.4;"></p>
        <button class="close-btn" onclick="document.getElementById('phrase-modal').style.display='none'">Cerrar</button>
    </div>

    <audio id="music" loop preload="auto">
        <source src="https://files.catbox.moe/u1x9g0.mp3" type="audio/mpeg">
    </audio>

    <script>
        const sf = document.getElementById('star-field');
        const bouquet = document.getElementById('bouquet');

        // Estrellas fijas
        for(let i=0; i<100; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = (Math.random()*2+1)+'px';
            s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
            s.style.setProperty('--d', (Math.random()*3+2)+'s');
            sf.appendChild(s);
        }

        // Estrellas fugaces
        setInterval(() => {
            const ss = document.createElement('div');
            ss.className = 'shooting-star';
            ss.style.left = (Math.random() * 50 + 100) + 'vw';
            ss.style.top = (Math.random() * 50) + 'vh';
            sf.appendChild(ss);
            setTimeout(() => ss.remove(), 4000);
        }, 5000);

        function start() {
            document.getElementById('music').play().catch(() => {});
            document.getElementById('welcome').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome').style.display = 'none';
                document.getElementById('content').style.display = 'flex';
            }, 800);
        }

        const msgs = [
            "Eres la razón por la que todos mis d&iacute;as son bonitos. 💕",
            "Tus ojos brillan m&aacute;s que estas flores. 💛",
            "No hay ramo que se compare a ti. 🌷",
            "Tu dulzura me enamora cada d&iacute;a m&aacute;s. ✨",
            "Eres la ni&ntilde;a m&aacute;s bonita del mundo. 👑",
            "Gracias por iluminar mis d&iacute;as grises. 🌟"
        ];

        // Función para manejar el clic en el ramo
        function handleBouquetClick(event) {
            // 1. Mostrar frase
            showMsg();

            // 2. Crear flores 🌸
            const rect = bouquet.getBoundingClientRect();
            // Crear 3 flores en posiciones aleatorias cerca del toque
            for (let i = 0; i < 3; i++) {
                const flower = document.createElement('div');
                flower.className = 'pop-flower';
                flower.innerText = '🌸';
                
                // Posicionar cerca de donde se hizo clic dentro del ramo
                flower.style.left = (event.clientX - rect.left + (Math.random() - 0.5) * 50) + 'px';
                flower.style.top = (event.clientY - rect.top + (Math.random() - 0.5) * 30) + 'px';
                
                bouquet.appendChild(flower);
                
                // Eliminar la flor después de la animación
                setTimeout(() => flower.remove(), 1500);
            }
        }
        
        function showMsg() {
            document.getElementById('phrase-modal').style.display = 'block';
            document.getElementById('msg-text').innerHTML = msgs[Math.floor(Math.random()*msgs.length)];
        }
    </script>
</body>
</html>
